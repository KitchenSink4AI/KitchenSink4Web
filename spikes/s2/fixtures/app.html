<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S2 fixture: a React SPA that re-renders, reorders, and routes</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; }
  header { background: #eee; padding: 8px; }
  nav a { margin-right: 12px; }
  main { padding: 12px; min-height: 400px; }
  aside { padding: 12px; background: #f6f6f6; }
  .row { padding: 4px 0; }
  dialog[open] { border: 2px solid #333; padding: 16px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script>
// Every interactive element carries data-truth, a stable semantic identity the
// fixture preserves across every mutation. The anchor scheme NEVER reads it;
// it exists only so the harness can score a rebind as correct or false. Any
// scheme that peeked at it would score 100 percent and mean nothing.
const e = React.createElement;

function Btn(props) {
  return e('button', {
    'data-truth': props.truth,
    'data-testid': props.testid || undefined,
    id: props.domid || undefined,
    onClick: props.onClick,
  }, props.label);
}

function Home(props) {
  const suffix = props.renamed ? ' (updated)' : '';
  return e('div', {key: props.epoch},
    e('h1', null, 'Dashboard' + suffix),
    e('form', {name: 'profile', 'aria-label': 'Profile'},
      e('label', {htmlFor: 'email'}, 'Email address'),
      e('input', {id: 'email', name: 'email', type: 'email',
                  'data-truth': 'field-email'}),
      e('label', {htmlFor: 'nick'}, 'Display name'),
      e('input', {id: 'nick', name: 'nick', 'data-truth': 'field-nick'}),
      e(Btn, {truth: 'btn-save', label: 'Save' + suffix, domid: 'save'}),
      // Two identically named controls in ONE region. The house rule is that
      // no tool ever acts on first match, so this pair must resolve to
      // AMBIGUOUS_LOCATION rather than to whichever one comes first.
      e(Btn, {truth: 'btn-delete-a', label: 'Delete'}),
      e(Btn, {truth: 'btn-delete-b', label: 'Delete'})
    ),
    e('section', {'aria-label': 'Recent items'},
      props.items.map(function (item) {
        return e('div', {className: 'row', key: item.id},
          e(Btn, {truth: 'item-' + item.id, label: 'Open ' + item.title,
                  testid: 'item-' + item.id}));
      })
    )
  );
}

function Settings(props) {
  // The cross-page trap: role, name, and landmark all match Home's Save
  // button, and it is a different control on a different route. A fuzzy
  // rebind that ignores the URL clicks this one and reports success.
  return e('div', {key: props.epoch},
    e('h1', null, 'Settings'),
    e('form', {name: 'prefs', 'aria-label': 'Profile'},
      e('label', {htmlFor: 'tz'}, 'Time zone'),
      e('input', {id: 'tz', name: 'tz', 'data-truth': 'field-tz'}),
      e(Btn, {truth: 'btn-save-settings', label: 'Save'})
    )
  );
}

function App() {
  const [route, setRoute] = React.useState('home');
  const [epoch, setEpoch] = React.useState(0);
  const [renamed, setRenamed] = React.useState(false);
  const [reversed, setReversed] = React.useState(false);
  const [dialogOpen, setDialogOpen] = React.useState(false);

  const base = [];
  for (let i = 1; i <= 12; i++) base.push({id: i, title: 'record ' + i});
  const items = reversed ? base.slice().reverse() : base;

  window.__s2 = {
    // A changing key on the route subtree forces React to UNMOUNT and
    // REMOUNT rather than reconcile, which is the node-replacing re-render
    // users actually report. Content and data-truth are unchanged.
    remount: () => setEpoch(n => n + 1),
    rename: () => setRenamed(v => !v),
    reorder: () => setReversed(v => !v),
    route: (r) => { history.pushState({}, '', '#/' + r); setRoute(r); },
    dialog: (open) => setDialogOpen(open),
  };

  return e(React.Fragment, null,
    e('header', null,
      e('nav', {'aria-label': 'Main'},
        e('a', {href: '#/home', 'data-truth': 'nav-home',
                onClick: () => window.__s2.route('home')}, 'Home'),
        e('a', {href: '#/settings', 'data-truth': 'nav-settings',
                onClick: () => window.__s2.route('settings')}, 'Settings'),
        e('a', {href: '/other.html', 'data-truth': 'nav-away'}, 'Leave app'))),
    e('main', null,
      route === 'home'
        ? e(Home, {epoch: epoch, renamed: renamed, items: items})
        : e(Settings, {epoch: epoch})),
    e('aside', {'aria-label': 'Sidebar'},
      // A third Delete, in a DIFFERENT landmark. Scoping by landmark is what
      // keeps this one out of the Home pair's candidate set.
      e(Btn, {truth: 'btn-delete-side', label: 'Delete'}),
      e(Btn, {truth: 'btn-help', label: 'Help'})),
    dialogOpen
      ? e('div', {role: 'dialog', 'aria-label': 'Confirm', 'aria-modal': 'true'},
          e('p', null, 'Are you sure?'),
          e(Btn, {truth: 'btn-confirm', label: 'Confirm'}),
          e(Btn, {truth: 'btn-cancel', label: 'Cancel',
                  onClick: () => window.__s2.dialog(false)}))
      : null
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
</html>
