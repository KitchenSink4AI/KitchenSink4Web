<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<style>
  body { font: 15px system-ui, sans-serif; margin: 0; padding: 16px; }
  label { display: block; margin-top: 10px; }
</style>
</head>
<body>
<main>
  <h1>Sign in</h1>
  <p role="alert">Your session has expired. Please log in again.</p>
  <form name="login" method="post" action="/login">
    <label for="user">Email address</label>
    <input id="user" name="username" type="email" autocomplete="username">

    <label for="pw">Password</label>
    <input id="pw" name="password" type="password"
           autocomplete="current-password" value="fixture-not-a-secret">

    <label for="otp">One-time code</label>
    <input id="otp" name="otp" autocomplete="one-time-code"
           inputmode="numeric">

    <button type="submit">Sign in</button>
  </form>
</main>
</body>
</html>
