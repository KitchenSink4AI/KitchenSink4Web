<!doctype html><meta charset=utf-8><title>image submit</title>
<body>
<h1>Checkout</h1>
<!-- A form whose only submit control is an <input type=image>, plus a real cc field -->
<form id="pay" action="blank.html" method="get">
  <input id="u" name="user" value="">
  <input id="cc" name="card" autocomplete="cc-number" value="">
  <input id="imgbtn" type="image" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="Pay now" width="80" height="30">
</form>
<script>
window.__submitted = false;
document.getElementById('pay').addEventListener('submit', function(e){ window.__submitted = true; e.preventDefault(); });
</script>
