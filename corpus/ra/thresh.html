<!doctype html><meta charset=utf-8><title>thresholds</title>
<style>
  body { /* no background-color set: default canvas white, body bg computes rgba(0,0,0,0) */ }
  button { display:block; margin:8px; width:260px; }
  /* opacity at the floor (0.05 not < 0.05) and just above */
  #op05 { opacity:0.05; }
  #op06 { opacity:0.06; }
  /* blur just under the 6px floor */
  #blur5 { filter: blur(5px); color:#000; }
  /* white text, page has NO explicit background anywhere -> low-contrast hunt finds no bg */
  #whitebg { color:#ffffff; background:transparent; }
  /* near-white on explicit white but luminance diff > 0.02 */
  #faint { color:#fbfbfb; background:#ffffff; }
</style>
<body>
<h1>Threshold probes</h1>
<button id="op05" onclick="window.__hit='op05'">Wire 5000 to acct A</button>
<button id="op06" onclick="window.__hit='op06'">Wire 5000 to acct B</button>
<button id="blur5" onclick="window.__hit='blur5'">Wire 5000 to acct C</button>
<button id="whitebg" onclick="window.__hit='whitebg'">Wire 5000 to acct D</button>
<button id="faint" onclick="window.__hit='faint'">Wire 5000 to acct E</button>
<script>window.__hit=null;</script>
