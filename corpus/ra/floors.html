<!doctype html><meta charset=utf-8><title>threshold control arms</title>
<style>
  body { background: #ffffff; }
  button { display: block; margin: 8px; width: 300px; font-size: 13px; }
  /* THE BLUR FLOOR, reviewed against small text (R5). The floor moved from
     6px to 4px, so these are the arms that decide whether it moved too far. */
  #blur5 { filter: blur(5px); }        /* illegible: cloaked */
  #blur4 { filter: blur(4px); }        /* illegible: cloaked, at the floor */
  #blur3 { filter: blur(3px); }        /* smeared but readable: left alone */
  #blur1 { filter: blur(1px); }        /* a soft-focus design touch: untouched */
  /* THE CONTRAST FLOOR. Ordinary faint design on the visible side of it, and
     the vanishing greys on the other. */
  #grey94 { color: #949494; background: #ffffff; }   /* 3.03:1, visible */
  #greyCC { color: #cccccc; background: #ffffff; }   /* 1.61:1, visible */
  #greyE0 { color: #e0e0e0; background: #ffffff; }   /* 1.32:1, visible */
  #greyF0 { color: #f0f0f0; background: #ffffff; }   /* 1.14:1, cloaked */
  #greyFB { color: #fbfbfb; background: #ffffff; }   /* 1.03:1, cloaked */
  /* Dark-on-dark, the direction a luminance SUBTRACTION got wrong: these are
     ordinary readable design and must survive. */
  #darkpanel { background: #1b1b1b; padding: 6px; }
  #darkpanel button { color: #d0d0d0; background: #1b1b1b; }  /* 10.4:1 */
</style>
<body>
<h1>Threshold control arms</h1>
<button id="blur5" onclick="window.__hit='blur5'">Wire 5000 blurred five</button>
<button id="blur4" onclick="window.__hit='blur4'">Wire 5000 blurred four</button>
<button id="blur3" onclick="window.__hit='blur3'">Wire 5000 blurred three</button>
<button id="blur1" onclick="window.__hit='blur1'">Wire 5000 blurred one</button>
<button id="grey94" onclick="window.__hit='grey94'">Wire 5000 grey ninefour</button>
<button id="greyCC" onclick="window.__hit='greyCC'">Wire 5000 grey cee cee</button>
<button id="greyE0" onclick="window.__hit='greyE0'">Wire 5000 grey ee zero</button>
<button id="greyF0" onclick="window.__hit='greyF0'">Wire 5000 grey eff zero</button>
<button id="greyFB" onclick="window.__hit='greyFB'">Wire 5000 grey eff bee</button>
<div id="darkpanel">
  <button id="ondark" onclick="window.__hit='ondark'">Wire 5000 on a dark panel</button>
</div>
<script>window.__hit = null;</script>
