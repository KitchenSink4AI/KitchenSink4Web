<!doctype html><meta charset=utf-8><title>a modal done properly</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; }
  /* A modal built the ordinary way: the backdrop sits BELOW the panel, so the
     panel's own buttons must stay actable while everything behind the
     backdrop must not. Both directions are the same rule, which is the point:
     occlusion follows the paint order rather than a list of element names. */
  #backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 5000; }
  #panel { position: fixed; left: 40px; top: 120px; width: 320px; height: 140px;
           background: #ffffff; z-index: 5001; padding: 12px; }
  #buried { position: absolute; left: 60px; top: 400px; width: 240px; height: 44px; }
</style>
<body>
<h1>Account settings</h1>
<button id="buried" onclick="window.__hit='buried'">Behind the modal backdrop</button>
<div id="backdrop"></div>
<div id="panel">
  <p>Confirm this?</p>
  <button id="inmodal" onclick="window.__hit='inmodal'">Confirm inside the modal</button>
</div>
<script>window.__hit = null;</script>
