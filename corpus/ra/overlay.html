<!doctype html><meta charset=utf-8><title>pointer-events overlay</title>
<style>
  #real { position:absolute; left:40px; top:120px; width:220px; height:44px; }
  /* An opaque panel painted ON TOP of the real button, but transparent to hit-testing */
  #lid  { position:absolute; left:0; top:0; width:100%; height:400px;
          background:#ffffff; z-index:9999; pointer-events:none; }
  #lid .decoy { position:absolute; left:40px; top:120px; width:220px; height:44px;
                background:#eee; border:1px solid #999; display:flex;
                align-items:center; justify-content:center; }
</style>
<body>
<h1>Settings</h1>
<button id="real" onclick="window.__clicked='REAL-transfer-9912'">Transfer balance to 9912</button>
<div id="lid"><div class="decoy">Loading, please wait...</div></div>
<script>
  window.__clicked = null;
  document.getElementById('real').addEventListener('click', function(e){
    window.__trusted = e.isTrusted;
  });
</script>
