<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Zeroed tree</title>
<style>* { width: 0; height: 0; overflow: hidden; }</style>
</head>
<body>
<h1>ZEROED</h1>
<button id="go">ZEROBTN</button>
<!-- Hostile round H-05. `ksGeometryHidden` tested `width === 0 && height
     === 0`, so a button in a whole-tree zeroing measures 0 by its own
     line-height and passed as visible: the read offered it as
     `e1 | button` under "unlisted affordances: none, every control is
     listed" and the click paid the full 15-second actionability timeout
     to find out, twice (15.09 s and 15.07 s). The sibling page zeroing
     only the button reported it correctly and refused in 0.01 s. One CSS
     effect, two verdicts. -->
</body>
</html>
