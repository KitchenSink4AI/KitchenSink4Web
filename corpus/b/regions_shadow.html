<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Corpus B: region scoping, with a component inside one region</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; padding: 12px; }
  section { border: 1px solid #ccc; padding: 8px; margin: 8px 0; }
</style>
</head>
<body>
<h1>Region scoping</h1>
<p>Three places hold a control called Save and one of them is inside a
component. A search scoped to one region must return that region's Save and
no other, and it must still reach into the component that region owns.</p>

<section aria-label="Draft panel">
  <h2>Draft panel</h2>
  <button id="draft-save">Save</button>
  <button id="draft-only">Publish draft</button>
  <!-- The component lives INSIDE the draft panel. A scoped search has to
       cross this boundary to find what is under it, and a search scoped to
       the other region has to not. -->
  <div id="draft-widget"></div>
</section>

<section aria-label="Archive panel">
  <h2>Archive panel</h2>
  <button id="archive-save">Save</button>
  <button id="archive-only">Restore archive</button>
  <div id="archive-widget"></div>
</section>

<footer>
  <button id="footer-save">Save</button>
</footer>

<script>
function fill(root, label) {
  root.innerHTML =
    '<h3>' + label + '</h3>' +
    '<p>Content inside the ' + label + ' component.</p>' +
    '<button data-truth="' + label + '">Save inside ' + label + '</button>';
}
fill(document.getElementById('draft-widget').attachShadow({mode: 'open'}),
     'draft-widget');
fill(document.getElementById('archive-widget').attachShadow({mode: 'open'}),
     'archive-widget');

// Ground truth for the harness only.
window.__truth = {
  save_buttons_page_wide: 5,        // 3 light DOM, 2 inside components
  save_buttons_in_draft_panel: 2,   // #draft-save and the component's own
  open_roots: 2
};
</script>
</body>
</html>
