<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Corpus B: a page that mutates every 100ms</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; padding: 12px; }
  #ticker li { padding: 2px 0; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<h1>Live dashboard</h1>
<p>Every 100 milliseconds this page rewrites text, replaces a node, toggles a
label, and reorders a list. Nothing settles.</p>

<main>
  <section aria-label="Status">
    <p>Connection: <span id="status">connecting</span></p>
    <p>Last tick: <span id="tick">0</span></p>
    <p>Rate: <span id="rate">0</span> events per second</p>
  </section>

  <section aria-label="Ticker">
    <h2>Ticker</h2>
    <ul id="ticker"></ul>
  </section>

  <section aria-label="Controls">
    <h2>Controls</h2>
    <!-- This button is REPLACED, not updated: the old node is removed and a
         new one takes its place with the same accessible name. Any anchor
         holding a node reference is dead within 100ms of being minted, which
         is the case the rebind ladder exists for. -->
    <div id="slot"><button data-truth="btn-primary">Pause stream</button></div>
    <button data-truth="btn-stable" id="stable">Export</button>
  </section>
</main>

<script>
// Two stable facts under all the churn: `data-truth` never changes, and the
// Export button is never replaced. A read taken at two different moments
// disagrees on almost everything else, so a projection that promises
// stability here is promising something the page will not honour, and a
// delta engine that reports "everything changed" every tick is useless.
const TICK_MS = 100;
let n = 0;
window.__mutations = 0;

const ticker = document.getElementById('ticker');
for (let i = 0; i < 12; i++) {
  const li = document.createElement('li');
  li.textContent = 'SYM' + i + '  0.00';
  ticker.appendChild(li);
}

setInterval(function () {
  n += 1;
  window.__mutations += 1;
  document.getElementById('tick').textContent = String(n);
  document.getElementById('status').textContent =
    (n % 2 === 0) ? 'connected' : 'syncing';
  document.getElementById('rate').textContent = String((n * 7) % 400);

  const rows = ticker.children;
  for (let i = 0; i < rows.length; i++) {
    rows[i].textContent = 'SYM' + i + '  ' + (((n + i) * 13) % 1000 / 100).toFixed(2);
  }
  // Reorder by rotation, so positional identity is worthless too.
  ticker.appendChild(ticker.firstElementChild);

  const slot = document.getElementById('slot');
  const fresh = document.createElement('button');
  fresh.setAttribute('data-truth', 'btn-primary');
  fresh.textContent = 'Pause stream';
  slot.replaceChildren(fresh);
}, TICK_MS);
</script>
</body>
</html>
