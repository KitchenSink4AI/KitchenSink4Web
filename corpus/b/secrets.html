<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Corpus B: a checkout form full of secrets</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; padding: 12px; }
  label { display: block; margin-top: 8px; }
  fieldset { margin: 12px 0; }
</style>
</head>
<body>
<h1>Complete your purchase</h1>

<main>
<form name="checkout" method="post" action="/checkout/submit">
  <fieldset>
    <legend>Account</legend>
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" value="reader@example.org"
           required>

    <!-- Credential blindness, the whole reason this page exists. Every field
         below carries a real-looking value in the DOM. A projection that
         prints field values prints a password and a card number into the
         transcript, and a transcript is forever. The rule is that these are
         never read, not that they are read and then redacted: a redaction
         that runs after the value is in memory has already lost on any path
         that logs before it. The field's PRESENCE and its name are what the
         caller needs, and those are safe. -->
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password"
           autocomplete="current-password" value="hunter2-not-a-real-secret">

    <label for="pw2">Confirm password</label>
    <input id="pw2" name="password_confirm" type="password"
           value="hunter2-not-a-real-secret">

    <label for="otp">One-time code</label>
    <input id="otp" name="otp" autocomplete="one-time-code" inputmode="numeric"
           value="482913">
  </fieldset>

  <fieldset>
    <legend>Payment</legend>
    <label for="cc">Card number</label>
    <input id="cc" name="cardnumber" autocomplete="cc-number"
           inputmode="numeric" value="4111 1111 1111 1111">

    <label for="cc-name">Name on card</label>
    <input id="cc-name" name="ccname" autocomplete="cc-name"
           value="A Reader">

    <label for="cc-exp">Expiry</label>
    <input id="cc-exp" name="cc-exp" autocomplete="cc-exp" value="04/29">

    <label for="cvc">Security code</label>
    <input id="cvc" name="cvc" autocomplete="cc-csc" value="931">

    <!-- Not typed as a password and not named like one either. The give-away
         is the autocomplete token, which is why the rule keys on the token
         and not only on the type. -->
    <label for="acct">Bank account number</label>
    <input id="acct" name="acct" value="000123456789">
  </fieldset>

  <fieldset>
    <legend>Delivery</legend>
    <!-- Ordinary fields, deliberately. A blanket refusal to read any form is
         not credential blindness, it is a broken form inventory, so the page
         needs safe fields to prove the line is drawn in the right place. -->
    <label for="addr">Street address</label>
    <input id="addr" name="address" value="12 Example Street">

    <label for="city">City</label>
    <input id="city" name="city" value="Seoul">

    <label for="ship">Shipping speed</label>
    <select id="ship" name="ship">
      <option value="std">Standard, 5 days</option>
      <option value="exp" selected>Express, 2 days</option>
      <option value="ovn">Overnight</option>
    </select>

    <label><input type="checkbox" name="gift"> This is a gift</label>
  </fieldset>

  <button type="submit">Pay 42,000 won</button>
</form>

<!-- A secret OUTSIDE the form as well, because a rule scoped to form
     descendants misses this one entirely. -->
<h2>API access</h2>
<label for="token">Personal access token</label>
<input id="token" name="token" type="password"
       value="ghp_notarealtokenatall000000000000000000">
<button id="copy-token">Copy token</button>
</main>
</body>
</html>
