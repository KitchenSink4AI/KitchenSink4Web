<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Corpus B: open and closed shadow roots</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; padding: 12px; }
  .host { border: 1px solid #ccc; padding: 8px; margin: 8px 0; }
</style>
</head>
<body>
<h1>Shadow DOM</h1>
<p>Four hosts. Two expose their trees, two do not, and one of the closed ones
is nested inside an open one so a walker that stops at the first closed
boundary still has to account for what is under it.</p>

<main>
  <div class="host" id="open-1"></div>
  <div class="host" id="open-2"></div>
  <div class="host" id="closed-1"></div>
  <div class="host" id="closed-2"></div>
  <button id="light-action">A button in the light DOM</button>
</main>

<script>
// OPEN roots are reachable from `host.shadowRoot`, so a walker that knows to
// look finds this content and can act on it.
//
// CLOSED roots are not. `host.shadowRoot` is null and there is no supported
// way to reach the tree after the fact, which is why the projection counts
// them at CREATION time: an init script installed before any page script runs
// wraps `Element.prototype.attachShadow` and tallies the closed calls. That
// only works if the call happens at page script time, which is why these are
// created here rather than baked into the markup, and it is the reason this
// fixture exists at all. A read that silently reports "no hidden content" on
// a page with two closed roots is lying by omission.
function fill(root, label, extra) {
  root.innerHTML =
    '<style>p{margin:2px 0}</style>' +
    '<h2>' + label + '</h2>' +
    '<p>Content that lives inside the ' + label + '.</p>' +
    '<label>Field in ' + label + ' <input name="in-' + label + '"></label>' +
    '<button data-truth="btn-' + label + '">Act in ' + label + '</button>' +
    (extra || '');
}

const o1 = document.getElementById('open-1').attachShadow({mode: 'open'});
fill(o1, 'open-root-one');

// An open root that CONTAINS a closed root. Depth is the trap here.
const o2 = document.getElementById('open-2').attachShadow({mode: 'open'});
fill(o2, 'open-root-two', '<div id="nested-host"></div>');
const nested = o2.getElementById('nested-host')
  .attachShadow({mode: 'closed'});
fill(nested, 'closed-root-nested');

const c1 = document.getElementById('closed-1').attachShadow({mode: 'closed'});
fill(c1, 'closed-root-one');

const c2 = document.getElementById('closed-2').attachShadow({mode: 'closed'});
fill(c2, 'closed-root-two');

// Ground truth for the harness only. The projection must NEVER read this; it
// exists so a test can score the init-script counter as right or wrong.
window.__truth = {open_roots: 2, closed_roots: 3, closed_nested_in_open: 1};
</script>
</body>
</html>
