<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Republic of Fixtures</title>
</head><body>
<!--
  A WIKIPEDIA-SHAPED INFOBOX WITH TEMPLATESTYLES INSIDE THE CELL. MediaWiki
  inlines a `<style data-mw-deduplicate=...>` element into the first cell that
  needs it, and `textContent` on that cell returns the CSS RULES followed by
  the value. The field test (2026-09-08, sonnet deep round) watched
  extract_fields answer `Official languages` with 100 percent stylesheet
  garbage: the right row matched and the value was CSS.

  That is the confident-wrong-value class this whole feature exists to refuse,
  and it is not exotic markup. Every large Wikipedia article has it.
-->
<table class="infobox">
  <tr><th colspan="2">Republic of Fixtures</th></tr>
  <tr>
    <th>Official languages</th>
    <td><style data-mw-deduplicate="TemplateStyles:r1126788409">
      .mw-parser-output .hlist dl{margin:0}
      .mw-parser-output .hlist dd{display:inline}
      .mw-parser-output .hlist dd:after{content:" \00b7 ";font-weight:bold}
    </style>English, Fixturese</td>
  </tr>
  <tr>
    <th>Capital</th>
    <td>Corpus City</td>
  </tr>
  <tr>
    <th>Population</th>
    <td><script type="application/json">{"note":"not a value"}</script>4,120</td>
  </tr>
</table>
</body></html>
