<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Frame-gated reveal</title></head>
<body>
<div id="slot"></div>
<!-- Hostile round H-06. Fix wave 8 gave the ARMING probe a
     two-animation-frame yield so a lid raised in requestAnimationFrame is
     composited before the click verdict. The READ path got no equivalent,
     so this page — an h1, a paragraph and a button revealed on frame 5 —
     read as having no controls at all, and the completeness block
     affirmed it: "unlisted affordances: none, every control is listed",
     "blocks omitted entirely: affordances (no interactive elements)".
     An empty read looked final, and nothing signalled that the page was
     still materialising. -->
<script>
  let n = 0;
  (function frame() {
    if (++n >= 5) {
      document.getElementById('slot').innerHTML =
        '<h1>REVEALED</h1><p>The page finished materialising.</p>' +
        '<button>Continue</button>';
      return;
    }
    requestAnimationFrame(frame);
  })();
</script>
</body>
</html>
