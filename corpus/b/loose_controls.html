<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Corpus B: an app shell whose controls live outside any form</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; }
  header { background: #22304a; color: #fff; padding: 10px 14px; }
  header a { color: #dce6f5; margin-right: 14px; }
  .toolbar { border-bottom: 1px solid #ddd; padding: 10px 14px;
             display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  aside { float: right; width: 260px; border-left: 1px solid #eee;
          padding: 10px 14px; }
  main { padding: 10px 14px; }
  form { border: 1px solid #ccc; padding: 12px; max-width: 420px; }
  label { display: block; margin-top: 6px; }
</style>
</head>
<body>
<!-- The Phase 2 gate case this page exists for.

     A projection may exempt form controls from the primary-actions class on
     the argument that they are inventoried separately and were never sampled
     as candidate actions. That argument is only sound if the page's real
     controls are inside a form. On every application shell shipped this
     decade they are not: the search box, the filter toggles, the sort
     select, the view switcher, and the bulk-action buttons are loose
     elements bound by a framework, with no <form> ancestor anywhere. They
     compete for the same budget as the links, and a ranker that quietly
     drops them returns a first read with no way to use the page.

     So: 19 loose controls outside any form, one real form with 6 controls
     inside it, and a long list of in-content links competing with both. A
     test that finds the form's controls and not the toolbar's has found the
     bug this fixture was built for. -->

<header>
  <strong>Workbench</strong>
  <nav aria-label="Primary">
    <a href="/dashboard">Dashboard</a>
    <a href="/records">Records</a>
    <a href="/reports">Reports</a>
    <a href="/admin">Admin</a>
  </nav>
</header>

<div class="toolbar" role="toolbar" aria-label="Record tools">
  <!-- LOOSE control 1: a search box with no form, submitted by keystroke. -->
  <label for="q">Search records</label>
  <input id="q" name="q" type="search" placeholder="Search records"
         aria-label="Search records">
  <button id="run-search">Search</button>

  <!-- LOOSE controls: filter toggles. -->
  <label><input type="checkbox" id="f-open" checked> Open</label>
  <label><input type="checkbox" id="f-closed"> Closed</label>
  <label><input type="checkbox" id="f-mine"> Assigned to me</label>
  <label><input type="checkbox" id="f-flagged"> Flagged</label>

  <!-- LOOSE controls: a sort select and a page-size select. -->
  <label for="sort">Sort by</label>
  <select id="sort" name="sort">
    <option>Newest first</option>
    <option>Oldest first</option>
    <option>Most active</option>
  </select>
  <label for="per-page">Per page</label>
  <select id="per-page" name="per_page">
    <option>25</option><option>50</option><option>100</option>
  </select>

  <!-- LOOSE controls: a radio group acting as a view switcher. -->
  <fieldset style="border:none;padding:0;margin:0">
    <legend style="float:left;margin-right:6px">View</legend>
    <label><input type="radio" name="view" value="list" checked> List</label>
    <label><input type="radio" name="view" value="board"> Board</label>
    <label><input type="radio" name="view" value="calendar"> Calendar</label>
  </fieldset>

  <!-- LOOSE controls: bulk actions, the destructive one included. -->
  <button id="bulk-assign">Assign selected</button>
  <button id="bulk-export">Export selected</button>
  <button id="bulk-archive">Archive selected</button>
  <button id="bulk-delete">Delete selected</button>

  <!-- LOOSE controls: a range and a date, both real inputs, neither in a
       form and neither shaped like a button. -->
  <label for="since">Updated since</label>
  <input id="since" type="date" value="2026-01-01">
  <label for="conf">Minimum confidence</label>
  <input id="conf" type="range" min="0" max="100" value="60">

  <!-- LOOSE control: a switch built from a div, so the page carries the
       role-invisible shape here too. -->
  <span role="switch" aria-checked="false" tabindex="0" id="compact">
    Compact rows
  </span>
</div>

<aside aria-label="Saved filters">
  <h2>Saved filters</h2>
  <ul>
    <li><a href="/f/1">Everything I own</a></li>
    <li><a href="/f/2">Stale over 30 days</a></li>
    <li><a href="/f/3">Escalated this week</a></li>
  </ul>
  <!-- LOOSE control in a THIRD landmark, so scoping matters. -->
  <button id="new-filter">New filter</button>
</aside>

<main>
  <h1>Records</h1>

  <h2>A real form, for contrast</h2>
  <!-- Six controls that ARE inside a form. The inventory should carry them
       and the ranker may treat them differently; the point of the page is
       that this treatment cannot be extended to the toolbar above. -->
  <form name="quick-add" method="post" action="/records/new">
    <label for="title">Title</label>
    <input id="title" name="title" required>
    <label for="owner">Owner</label>
    <input id="owner" name="owner">
    <label for="prio">Priority</label>
    <select id="prio" name="priority">
      <option>Low</option><option>Normal</option><option>Urgent</option>
    </select>
    <label for="notes">Notes</label>
    <textarea id="notes" name="notes" rows="3"></textarea>
    <label><input type="checkbox" name="notify"> Notify the owner</label>
    <button type="submit">Create record</button>
  </form>

  <h2>Recent records</h2>
  <ul id="records"></ul>
</main>

<script>
// Forty in-content links, so the loose controls are competing for budget
// against ordinary page content rather than sitting alone on an empty page.
// Built here rather than pasted so the file stays readable; the count is
// fixed and the text is deterministic.
const list = document.getElementById('records');
for (let i = 1; i <= 40; i++) {
  const li = document.createElement('li');
  const a = document.createElement('a');
  a.href = '/records/' + i;
  a.textContent = 'REC-' + (1000 + i) +
    ': a record title long enough to look like a real row of work';
  li.appendChild(a);
  list.appendChild(li);
}

// Ground truth for the harness. Counted from the markup above, not derived
// at run time, so a test can compare against a number a human wrote down.
window.__truth = {
  loose_controls: 19,       // outside any <form>
  form_controls: 6,         // inside form[name=quick-add]
  loose_landmarks: ['toolbar', 'aside'],
};
</script>
</body>
</html>
