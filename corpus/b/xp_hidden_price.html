<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Product detail</title>
<style>
  .staff-only { display: none; }
  .star-rating { display: inline-block; width: 60px; height: 12px; }
</style>
</head><body>
<!--
  A display:none staff price sitting beside the visible retail price, both
  declared with the same microdata itemprop. The hidden one must not appear in
  ANY tier, including as a page-hint token's value: the shared visibility rule
  from visibility.js is what decides, and it is the same rule get_page_view,
  get_text, and find_elements use.

  The star rating is the styling-only case: a human sees three stars and the
  page never wrote the number down anywhere. The tool stays silent and says
  why, rather than learning one site's private encoding of its own classes.
-->
<main itemscope itemtype="https://schema.org/Product">
  <h1 itemprop="name">Anglepoise Type 75 Desk Lamp</h1>
  <p class="star-rating Three" aria-hidden="true"></p>
  <div itemprop="offers" itemscope itemtype="https://schema.org/Offer">
    <span class="staff-only" itemprop="price">&pound;0.01</span>
    <span class="retail" itemprop="price">&pound;189.00</span>
    <span itemprop="availability">In stock</span>
  </div>
</main>
</body></html>
