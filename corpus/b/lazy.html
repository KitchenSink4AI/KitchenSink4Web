<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Corpus B: lazy images with placeholder sources</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; padding: 12px; }
  .gallery img { width: 240px; height: 160px; background: #eee;
                 border: 1px solid #ccc; margin: 4px; }
  .spacer { height: 1400px; }
</style>
</head>
<body>
<h1>Photo gallery</h1>
<p>Every image below is lazy. The <code>src</code> attribute holds a
placeholder, the real file is parked in <code>data-src</code>, and nothing
swaps until the image scrolls into view.</p>

<main>
<div class="gallery">
  <!-- The landmine has three shapes and all three are here.

       1. Native `loading="lazy"` with a real src. The URL is correct and the
          bytes are not fetched yet. Reporting the src is honest.
       2. A 1x1 transparent GIF in `src` with the real URL in `data-src`. A
          projection that prints the src prints the same base64 blob for
          every image on the page and says nothing.
       3. A blurred base64 LQIP placeholder, same problem, bigger string. A
          serializer with no cap on attribute length spends real budget on
          it. -->

  <figure>
    <img loading="lazy" src="/photos/harbour-full.jpg"
         alt="A harbour at dawn" width="240" height="160">
    <figcaption>Native lazy, honest src</figcaption>
  </figure>

  <figure>
    <img loading="lazy"
         src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
         data-src="/photos/bridge-full.jpg"
         alt="A bridge in fog" width="240" height="160">
    <figcaption>Transparent pixel placeholder</figcaption>
  </figure>

  <figure>
    <img loading="lazy"
         src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAGCAYAAAD+Bd/7AAAAKUlEQVQI12NkYGD4z8DAwMgABYwMDAwMTAxIgIkBDTAxMDAwMDAwMAAAGgQBAX+dGhcAAAAASUVORK5CYII="
         data-src="/photos/street-full.jpg"
         data-srcset="/photos/street-480.jpg 480w, /photos/street-960.jpg 960w"
         alt="A street market" width="240" height="160">
    <figcaption>Blurred LQIP placeholder</figcaption>
  </figure>

  <figure>
    <!-- No alt, no data-src, and a placeholder src. There is nothing here to
         report except that an image exists. Saying so is the correct answer;
         inventing a description is not. -->
    <img loading="lazy" src="/assets/placeholder.svg"
         width="240" height="160">
    <figcaption>Placeholder with no alt text</figcaption>
  </figure>

  <figure>
    <picture>
      <source data-srcset="/photos/coast-960.avif" type="image/avif">
      <img loading="lazy" src="/assets/blank.png"
           data-src="/photos/coast-full.jpg"
           alt="A coastline" width="240" height="160">
    </picture>
    <figcaption>Picture element, lazy source</figcaption>
  </figure>
</div>

<div class="spacer">
  <p>A tall spacer, so the images further down are genuinely below the fold
  and stay unloaded on a read that never scrolls.</p>
</div>

<div class="gallery">
  <figure>
    <img loading="lazy"
         src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
         data-src="/photos/below-fold-1.jpg"
         alt="Below the fold, one" width="240" height="160">
    <figcaption>Below the fold, never requested</figcaption>
  </figure>
  <figure>
    <img loading="lazy"
         src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
         data-src="/photos/below-fold-2.jpg"
         alt="Below the fold, two" width="240" height="160">
    <figcaption>Below the fold, never requested</figcaption>
  </figure>
</div>
</main>

<script>
// The swap a real site does. It runs only for images that enter the viewport,
// so the DOM a projection reads depends on where the page was scrolled, and
// two reads of the "same" page legitimately disagree about every src.
window.__swapped = 0;
const io = new IntersectionObserver(function (entries, obs) {
  for (const entry of entries) {
    if (!entry.isIntersecting) continue;
    const img = entry.target;
    const real = img.getAttribute('data-src');
    if (real) { img.src = real; window.__swapped += 1; }
    obs.unobserve(img);
  }
});
document.querySelectorAll('img[data-src]').forEach(function (img) {
  io.observe(img);
});
</script>
</body>
</html>
