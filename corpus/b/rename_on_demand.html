<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Corpus B: a stable key reassigned, on demand</title>
</head>
<body>
<main>
  <!-- The H2 shape, with the timer replaced by a function the harness calls.
       The gauntlet's own rename page swaps after 700 ms, which is right for
       proving the refusal and useless for proving it inside a window that is
       microseconds wide in production. `rename()` lets a test hold the swap
       until the exact moment it wants it. -->
  <button id=":r1:" data-testid="tid" type="button" aria-label="Save">Save</button>
  <button id="del" type="button" aria-label="Delete account"
          onclick="window.__deleted = (window.__deleted || 0) + 1">Delete account</button>
</main>
<script>
  // The volatile framework id and the testid move from Save onto Delete
  // account, and Save leaves the DOM. The key survives; what wears it does
  // not. Delete is type=button on purpose, so the click is UNGATED: the
  // refusal under test has to come from the identity cross-check, not from
  // the form-submit gate catching it by luck.
  window.rename = function () {
    const save = document.querySelector('[aria-label="Save"]');
    const del = document.getElementById('del');
    if (!save || save === del) return;
    save.remove();
    del.id = ':r1:';
    del.setAttribute('data-testid', 'tid');
  };
  window.__truth = { renames_on_demand: true };
</script>
</body>
</html>
