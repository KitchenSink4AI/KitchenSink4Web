<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S2 fixture: a different page that looks the same</title>
<style>body { font: 14px system-ui, sans-serif; margin: 0; } header { background:#eee; padding:8px } main,aside{padding:12px}</style>
</head>
<body>
<!-- A genuinely different page carrying the same landmarks and the same
     control names. Cross-page rebinding is off by default, and this page is
     what makes that default measurable rather than principled: every fuzzy
     match here is a false rebind, and there are four of them waiting. -->
<header><nav aria-label="Main">
  <a href="app.html" data-truth="other-nav-home">Home</a>
  <a href="#/settings" data-truth="other-nav-settings">Settings</a>
</nav></header>
<main>
  <h1>Dashboard</h1>
  <form name="profile" aria-label="Profile">
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" data-truth="other-field-email">
    <button data-truth="other-btn-save" id="save">Save</button>
    <button data-truth="other-btn-delete">Delete</button>
  </form>
</main>
<aside aria-label="Sidebar">
  <button data-truth="other-btn-delete-side">Delete</button>
  <button data-truth="other-btn-help">Help</button>
</aside>
</body>
</html>
