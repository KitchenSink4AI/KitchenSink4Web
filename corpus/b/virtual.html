<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S2 fixture: a react-window virtualized list, 20 of 5,000</title>
<style>body { font: 14px system-ui, sans-serif; margin: 0; padding: 12px; }</style>
</head>
<body>
<h1>Virtualized list</h1>
<div id="root"></div>

<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/react-window.umd.js"></script>
<script>
// PLAN 1.3's corpus B names "a react-window virtualized list holding 20 of
// 5,000 rows". This is the real library rather than a hand-rolled imitation,
// because the failure being tested is DOM node RECYCLING: react-window keeps
// a small window of nodes and rewrites their contents as you scroll, so a
// scheme that identifies an element by anything positional will happily
// rebind row 4,000's anchor onto whatever row now occupies that node.
const e = React.createElement;
const ROWS = 5000;

function Row(props) {
  const i = props.index;
  return e('div', {style: props.style},
    e('button', {'data-truth': 'row-' + i, 'data-testid': 'row-' + i},
      'Open record ' + i));
}

function App() {
  const ref = React.useRef(null);
  window.__s2 = {
    scrollTo: (offset) => ref.current && ref.current.scrollTo(offset),
    scrollToItem: (i) => ref.current && ref.current.scrollToItem(i, 'start'),
  };
  return e('nav', {'aria-label': 'Records'},
    e(ReactWindow.FixedSizeList, {
      ref: ref, height: 600, width: 400, itemCount: ROWS, itemSize: 30,
    }, Row));
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
</html>
