<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SVG text</title></head>
<body>
<p>ONE</p>
<!-- Fuzzer class 2 and class 10. The <text> elements below are visible,
     rendered, selectable text and appeared in NO payload: not get_text,
     not read_pages, not get_page_view, not get_article, not
     extract_fields. The completeness ledger had no SVG vocabulary at all,
     so there was no counter either, and the read declared itself complete.
     The <a href> is class 10: an SVG anchor exposes href as an
     SVGAnimatedString, and stringifying the DOM property produced the
     fabricated URL "/[object%20SVGAnimatedString]" presented as fact. -->
<svg width="400" height="200" viewBox="0 0 400 200">
  <title>SVGTITLEMETA</title>
  <desc>SVGDESCMETA</desc>
  <text x="10" y="30">SVGLINEONE</text>
  <text x="10" y="60">SVGLINETWO</text>
  <text x="10" y="90"><tspan>SVGLINE</tspan><tspan>THREE</tspan></text>
  <a href="/svgtarget"><text x="10" y="120">SVGLINKTEXT</text></a>
</svg>
</body>
</html>
