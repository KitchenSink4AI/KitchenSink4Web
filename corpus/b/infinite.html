<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Corpus B: an infinite-scroll feed</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; padding: 12px; }
  li { padding: 6px 0; border-bottom: 1px solid #eee; }
  #sentinel { height: 40px; color: #888; }
</style>
</head>
<body>
<h1>Activity feed</h1>
<p>A feed that never ends. Every time the sentinel enters the viewport another
page of twenty-five items is appended, so the document grows for as long as
anything keeps scrolling.</p>

<main>
<ul id="feed" aria-label="Activity"></ul>
<div id="sentinel">Loading more...</div>
</main>

<script>
// The landmine: there is no bottom. A read that scrolls to find the end never
// finds one, and a completeness count taken before and after a scroll
// disagrees for a reason that is not a bug. The projection has to report a
// truncated view as truncated rather than reporting a total.
const PAGE = 25;
let served = 0;
window.__pages_loaded = 0;

function appendPage() {
  const feed = document.getElementById('feed');
  const frag = document.createDocumentFragment();
  for (let i = 0; i < PAGE; i++) {
    const n = served + i;
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = '/item/' + n;
    a.textContent = 'Item ' + n + ': an activity entry with enough words to '
      + 'read like a real feed row rather than a placeholder';
    li.appendChild(a);
    frag.appendChild(li);
  }
  served += PAGE;
  feed.appendChild(frag);
  window.__pages_loaded += 1;
  window.__items = served;
}

// Two pages are present before load completes, so a projection run that never
// scrolls still has content to read and still has to say the list is partial.
appendPage();
appendPage();

new IntersectionObserver(function (entries) {
  for (const entry of entries) {
    if (entry.isIntersecting) appendPage();
  }
}, {rootMargin: '200px'}).observe(document.getElementById('sentinel'));
</script>
</body>
</html>
