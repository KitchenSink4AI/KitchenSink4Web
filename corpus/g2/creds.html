<!doctype html>
<html><head><meta charset="utf-8"><title>Sign in</title></head>
<body>
<h1>Sign in</h1>
<form id="f" action="/blank.html" method="get">
  <label for="u">Username</label><input id="u" name="u" type="text">

  <!-- Disguise 1: a text input that autocomplete marks as a password -->
  <label for="d1">Account passphrase</label>
  <input id="d1" name="d1" type="text" autocomplete="current-password">

  <!-- Disguise 2: a real password field -->
  <label for="d2">Password</label><input id="d2" name="d2" type="password">

  <!-- Disguise 3: a text field that becomes type=password on focus -->
  <label for="d3">Recovery key</label><input id="d3" name="d3" type="text">

  <!-- Disguise 4: a one-time code -->
  <label for="d4">One time code</label>
  <input id="d4" name="d4" type="text" autocomplete="one-time-code">

  <!-- Payment shaped -->
  <label for="cc">Card number</label>
  <input id="cc" name="cc" type="text" autocomplete="cc-number">

  <button type="submit" id="go">Sign in</button>
</form>

<!-- Disguise 5: a password field inside an open shadow root -->
<x-login id="xl"></x-login>

<script>
class XLogin extends HTMLElement {
  connectedCallback() {
    this.attachShadow({ mode: 'open' }).innerHTML =
      '<label for="sp">Shadow password</label>' +
      '<input id="sp" type="password" name="sp">';
  }
}
customElements.define('x-login', XLogin);
document.getElementById('d3').addEventListener('focus', function () {
  this.type = 'password';
});
window.__values = () => {
  const o = {};
  for (const el of document.querySelectorAll('input')) o[el.id] = el.value;
  const sp = document.getElementById('xl').shadowRoot.getElementById('sp');
  o['sp'] = sp.value;
  return o;
};
</script>
</body></html>
