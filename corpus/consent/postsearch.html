<!doctype html><meta charset=utf-8><title>post search</title>
<body>
<h1>Database filter</h1>
<!-- THE TIER 1 CONTROL. The same search over POST. The site made a claim
     about its own operation and this server believes it, which is the
     correct direction to be wrong in: it asks under `research` and is
     silent under `full`. -->
<form id="q" action="results.html" method="post">
  <input id="terms" name="q" value="">
  <button id="go" type="submit">Search</button>
</form>
<script>
window.__submitted = false;
document.getElementById('q').addEventListener('submit', function (e) {
  window.__submitted = true; e.preventDefault();
});
</script>
