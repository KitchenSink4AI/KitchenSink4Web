<!doctype html><meta charset=utf-8><title>checkout</title>
<body>
<h1>Pay</h1>
<!-- THE PIN THAT STOPS THE RULE FROM INVERTING. A GET checkout form. The
     GET rule is a TIER 0 ADMISSION TEST and never a TIER 2 EXEMPTION: this
     one gates as payment at every scope. -->
<form id="pay" action="charge.html" method="get">
  <label for="card">Card number</label>
  <input id="card" name="cardnumber" type="tel" inputmode="numeric" value="">
  <button id="go" type="submit">Pay now</button>
</form>
<script>
window.__submitted = false;
document.getElementById('pay').addEventListener('submit', function (e) {
  window.__submitted = true; e.preventDefault();
});
</script>
