<!doctype html><meta charset=utf-8><title>catalog search</title>
<body>
<h1>Library catalog</h1>
<!-- THE TIER 0 PAGE. A GET form with no secret, payment, or file field.
     RFC 9110 9.2.1 calls a GET submission safe, so this is the shape that
     submits silently under both consent scopes and the shape the whole
     redesign exists to stop prompting about. -->
<form id="q" action="results.html" method="get">
  <label for="terms">Keywords</label>
  <input id="terms" name="q" value="">
  <select id="field" name="field"><option>title</option><option>author</option></select>
  <button id="go" type="submit">Search</button>
</form>
<script>
window.__submitted = false;
document.getElementById('q').addEventListener('submit', function (e) {
  window.__submitted = true; e.preventDefault();
});
</script>
