name: Publish to PyPI

# Trusted publishing, registered by the author against THIS filename and the
# `pypi` environment below. Both halves have to match the registration or the
# release runs, looks green, and publishes nothing.
#
# Ship-phase checklist this workflow does NOT do for you (PLAN Phase 9):
#   - the `mcp-name` marker in README line 1, before the first release
#   - a sub-100-character `server.json` description
#   - registry publish IMMEDIATELY after device auth (the JWT dies in under an
#     hour, confirmed twice in the family)
#   - the author READOUT of all public copy before the commit
#   - attaching the packed .mcpb to the GitHub release

# A published GitHub Release is the ONLY thing that publishes a version.
#
# workflow_dispatch was removed in the 2026-09-15 security pass (finding 7). It
# let anyone holding a gh token with workflow scope publish to PyPI from a
# branch, with no Release, no tag and no reviewer, and Trusted Publishing did
# nothing to stop that: it authenticates the repository, not the intent. The
# pypi environment now also requires the owner's approval and only accepts main
# or a v* tag, so the dispatch path was the last way around a human.
#
# To publish: cut a Release. To retry a failed publish: re-run this workflow
# from its own Actions run, which keeps the Release as the thing that authorized
# it.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Verify the distribution
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing, no tokens anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Pinned by commit, not by @release/v1. That ref is a BRANCH, so it moves,
      # and this is the one step in the repository that can write to PyPI.
      # v1.14.2, the release/v1 head as of 2026-07-28.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
