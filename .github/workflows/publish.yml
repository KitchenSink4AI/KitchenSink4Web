name: Publish to PyPI

# Trusted publishing, registered by the author against THIS filename and the
# `pypi` environment below. Both halves have to match the registration or the
# release runs, looks green, and publishes nothing.
#
# Ship-phase checklist this workflow does NOT do for you (PLAN Phase 9):
#   - the `mcp-name` marker in README line 1, before the first release
#   - a sub-100-character `server.json` description
#   - registry publish IMMEDIATELY after device auth (the JWT dies in under an
#     hour, confirmed twice in the family)
#   - the author READOUT of all public copy before the commit
#   - attaching the packed .mcpb to the GitHub release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Verify the distribution
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing, no tokens anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
