name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        # The accessibility extra comes along because it is a PINNED engine
        # rather than a nicety: without it the tests that read an audit
        # refuse with "the engine is not installed" instead of running.
        run: pip install -e ".[dev,accessibility]"
      - name: Run test suite
        # tests/unit only. The browser half runs in its own job below, which
        # needs a downloaded browser and is therefore slower and narrower.
        run: python -m pytest tests/unit -q
      - name: Surface report (counts come from the script, never hand-math)
        run: python -X utf8 scripts/measure_surface.py

  browser:
    # The half that proves the product. Phase 1 opened long ago and this job
    # is it arriving: 243 test definitions that drive a real Chromium against
    # the local corpus. Split from the unit matrix rather than folded into it
    # because it downloads a browser, so a unit regression still reports in
    # a minute or two instead of waiting on this.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # The filter below diffs this push against the commit it started
          # from, and that commit has to be in the clone to be diffed.
          fetch-depth: 0
      - name: Is there anything here a browser could test?
        # A DOCS PUSH THAT FAILS THIS JOB IS A FALSE RED, and a false red
        # teaches the owner to stop reading the job. This suite drives a real
        # Chromium against a real corpus for six to twelve minutes, so it has
        # a flake rate that is small per run and not small across a week; a
        # prose edit to docs/index.html buys none of that coverage and can
        # still spend the red. Two of the failures on record (2026-09-16,
        # 4527660 and 327c8c0) were exactly this: one docs/index.html link
        # fix and one .gitignore line, each landing a genuine but unrelated
        # race in the suite.
        #
        # PUSH EVENTS ONLY, on purpose. A pull request always runs the whole
        # suite: that is where a change is actually judged, and a workflow
        # that reports nothing on a PR is a required check that never
        # arrives. Skipping steps rather than the job also keeps this job
        # reporting success instead of going missing.
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          run=true
          if [ "${{ github.event_name }}" = "push" ]; then
            before="${{ github.event.before }}"
            if [ -n "$before" ] \
               && git cat-file -e "${before}^{commit}" 2>/dev/null; then
              changed=$(git diff --name-only "$before" "${{ github.sha }}")
              echo "changed files:"
              echo "$changed"
              # Everything NOT matched here is treated as code. A new kind of
              # file is run, not skipped: the failure mode of guessing wrong
              # about a path is a suite that silently stops covering it.
              code=$(printf '%s\n' "$changed" | grep -vE \
                '^(docs/|research/|\.gitignore$|\.gitattributes$|LICENSE$)' \
                | grep -vE '\.md$' || true)
              if [ -z "$code" ]; then
                run=false
              fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = "false" ]; then
            echo "Docs, markdown or repo-metadata only: the browser suite did not run for this push." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@v7
        if: steps.filter.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Install
        if: steps.filter.outputs.run == 'true'
        run: pip install -e ".[dev,accessibility]"
      - name: Install Chromium and its system libraries (Linux)
        # Lane A is the browser the server ships with. Lane B drives an
        # installed Chrome, Edge, or Firefox and stays a local gate: a runner
        # has no installed browser the server did not put there itself.
        # `--with-deps` is a Linux-only apt step, so the two runners get
        # separate lines rather than one line that warns on Windows.
        if: steps.filter.outputs.run == 'true' && runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium (Windows)
        if: steps.filter.outputs.run == 'true' && runner.os == 'Windows'
        run: python -m playwright install chromium
      - name: Run browser suite (Linux, under a virtual display)
        # A runner has no X server, and the headed lane really does need one:
        # a headed launch there dies with "Missing X server or $DISPLAY"
        # before Chromium is up. `xvfb-run` supplies the display rather than
        # skipping the lane, so the headed tests are actually run here and
        # not merely counted. `-a` picks a free display number.
        if: steps.filter.outputs.run == 'true' && runner.os == 'Linux'
        run: xvfb-run -a python -m pytest tests/browser -q
      - name: Run browser suite (Windows)
        if: steps.filter.outputs.run == 'true' && runner.os == 'Windows'
        run: python -m pytest tests/browser -q
